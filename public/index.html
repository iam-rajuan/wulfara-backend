<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mgirmaye API - Status: Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent-1: #00ffcc;
            --accent-2: #7b2cbf;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        .blob-1,
        .blob-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-1) 0%, transparent 70%);
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, 50px) scale(1.1);
            }
        }

        /* Main Container */
        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent-1);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 255, 204, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-1);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent-1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(0, 255, 204, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 204, 0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .endpoints {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            text-align: left;
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 16px;
        }

        .endpoint-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .endpoint-item:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .method {
            background: var(--accent-2);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .method.get {
            background: #3b82f6;
        }

        .path {
            font-family: monospace;
            color: #d1d5db;
            font-size: 0.9rem;
            margin-left: 1rem;
            flex-grow: 1;
        }

        .desc {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="container">
        <div class="status-badge">
            <div class="status-dot"></div>
            System Operational
        </div>

        <h1>Wulfara API</h1>
        <p>Welcome to the Mgirmaye Backend Service. The API is up and running successfully. All systems are green.</p>

        <div class="endpoints">
            <div class="endpoint-item">
                <div>
                    <span class="method get">GET</span>
                    <span class="path">/health</span>
                </div>
                <span class="desc">System Health Check</span>
            </div>
            <div class="endpoint-item">
                <div>
                    <span class="method">API</span>
                    <span class="path">/api/v1/*</span>
                </div>
                <span class="desc">Main API Routes</span>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 Mgirmaye Systems.
        </div>
    </div>
</body>

</html>
